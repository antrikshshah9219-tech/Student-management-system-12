<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Management Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <!-- Icons ke liye Font Awesome link -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <ul class="nav-list">
                <li class="nav-item active">
                    <i class="fa-solid fa-chart-pie"></i> Dashboard
                </li>
                <li class="nav-item">
                    <i class="fa-solid fa-user-group"></i> Students
                </li>
                <li class="nav-item">
                    <i class="fa-solid fa-book"></i> Courses
                </li>
                <li class="nav-item">
                    <i class="fa-solid fa-calendar-check"></i> Attendence
                </li>
                <li class="nav-item">
                    <i class="fa-solid fa-file-lines"></i> Marks
                </li>
            </ul>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header>
                <h1>Dashboard</h1>
                <p>Welcome to the Student Management System</p>
            </header>

            <!-- Stats Cards -->
            <section class="stats-container">
                <div class="stat-card">
                    <div class="icon-box blue">
                        <i class="fa-solid fa-users"></i>
                    </div>
                    <div class="stat-info">
                        <span class="stat-title">Total Students</span>
                        <span class="stat-value">5</span>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="icon-box purple">
                        <i class="fa-solid fa-book-open"></i>
                    </div>
                    <div class="stat-info">
                        <span class="stat-title">Total Courses</span>
                        <span class="stat-value">4</span>
                    </div>
                </div>
            </section>

            <!-- Recent Data Sections -->
            <section class="data-tables">
                <div class="data-column">
                    <h2>Recent Students</h2>
                    <div id="recent-students-list" class="list-container">
                        <!-- JS se data load hoga -->
                    </div>
                </div>

                <div class="data-column">
                    <h2>Recent Marks</h2>
                    <div id="recent-marks-list" class="list-container">
                        <!-- JS se data load hoga -->
                    </div>
                </div>
            </section>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
